apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhacs-operator
  namespace: openshift-gitops
spec:
  project: default

  source:
    repoURL: https://github.com/YOUR_ORG/ocp-gitops.git
    targetRevision: main
    path: bootstrap/rhacs-operator

  destination:
    server: https://kubernetes.default.svc
    namespace: rhacs-operator

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
